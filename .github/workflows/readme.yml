name: Update README roadmap

on:
  push:
    branches: [master]
    paths:
      - 'tickets/**'
      - 'README.md'
      - 'scripts/update-readme.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-readme.mjs
      - name: Commit README if it changed
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update README roadmap from tickets"
          git push
